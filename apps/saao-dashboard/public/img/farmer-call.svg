<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-labelledby="t">
  <title id="t">A farmer in the field answering the advice call on a button phone</title>
  <defs>
    <clipPath id="round"><circle cx="160" cy="128" r="104"/></clipPath>
    <clipPath id="round2"><circle cx="20" cy="54" r="104"/></clipPath>
  </defs>
  <!-- backdrop: a round field -->
  <g clip-path="url(#round)">
    <circle cx="160" cy="128" r="104" fill="#EEF5E2"/>
    <path d="M40 176 Q 160 150 280 176 L280 240 L40 240 Z" fill="#79B425"/>
    <path d="M40 200 Q 160 178 280 200 L280 240 L40 240 Z" fill="#1D6517"/>
    <g stroke="#C0DE7B" stroke-width="2" stroke-linecap="round">
      <path d="M90 214 l-3 -10 M90 214 l0 -12 M90 214 l3 -10"/>
      <path d="M230 216 l-3 -10 M230 216 l0 -12 M230 216 l3 -10"/>
    </g>
  </g>
  <!-- the farmer -->
  <g transform="translate(140 74)" clip-path="url(#round2)">
    <!-- shirt -->
    <path d="M-34 126 Q -36 72 0 66 Q 36 72 34 126 Z" fill="#F7F1E3"/>
    <path d="M-10 68 L0 84 L10 68" fill="none" stroke="#D9CDB0" stroke-width="2"/>
    <!-- gamcha on the shoulder -->
    <path d="M-30 80 Q -14 92 6 70 L14 74 Q -8 104 -32 92 Z" fill="#C0392B" opacity=".85"/>
    <path d="M-28 86 Q -14 94 2 78" stroke="#F4D98B" stroke-width="2" fill="none"/>
    <!-- neck and head -->
    <rect x="-7" y="52" width="14" height="16" fill="#8A5A3C"/>
    <ellipse cx="0" cy="36" rx="22" ry="25" fill="#9A6644"/>
    <!-- head cloth -->
    <path d="M-23 30 Q -20 6 0 6 Q 22 6 24 30 Q 10 22 0 22 Q -12 22 -23 30 Z" fill="#FFFFFF"/>
    <!-- face -->
    <circle cx="-8" cy="38" r="2.2" fill="#2B1A10"/>
    <circle cx="8" cy="38" r="2.2" fill="#2B1A10"/>
    <path d="M-7 50 Q 0 55 7 50" stroke="#2B1A10" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M-16 44 Q -10 58 0 58 Q 10 58 16 44 Q 10 52 0 52 Q -10 52 -16 44 Z" fill="#3A2A1F" opacity=".55"/>
    <!-- arm and button phone at the ear -->
    <path d="M30 98 Q 44 70 30 44" stroke="#9A6644" stroke-width="12" fill="none" stroke-linecap="round"/>
    <rect x="20" y="24" width="15" height="28" rx="3" fill="#2A6E88"/>
    <rect x="23" y="27" width="9" height="8" fill="#C0DE7B"/>
    <g fill="#E8F3F7"><rect x="23" y="38" width="3" height="2"/><rect x="29" y="38" width="3" height="2"/><rect x="23" y="43" width="3" height="2"/><rect x="29" y="43" width="3" height="2"/></g>
  </g>
  <!-- the voice coming out of the phone -->
  <g fill="none" stroke="#55A6C3" stroke-width="4" stroke-linecap="round">
    <path d="M196 92 Q 206 108 196 124"/>
    <path d="M208 82 Q 224 108 208 134" opacity=".7"/>
    <path d="M220 72 Q 242 108 220 144" opacity=".45"/>
  </g>
  <!-- a speech bubble with the advice: a seedling and a date -->
  <g transform="translate(222 30)">
    <path d="M0 0 H76 Q 84 0 84 8 V44 Q 84 52 76 52 H22 L10 64 L12 52 H8 Q 0 52 0 44 V8 Q 0 0 8 0 Z" fill="#FFFFFF" stroke="#DDE5D8" stroke-width="2" transform="translate(-8 0)"/>
    <path d="M14 38 V20" stroke="#1D6517" stroke-width="3" stroke-linecap="round"/>
    <path d="M14 24 Q 4 22 4 12 Q 14 12 14 24 Z M14 28 Q 24 26 24 16 Q 14 16 14 28 Z" fill="#79B425"/>
    <rect x="34" y="12" width="32" height="28" rx="3" fill="#E8F3F7" stroke="#2A6E88" stroke-width="2"/>
    <rect x="34" y="12" width="32" height="8" fill="#2A6E88"/>
    <circle cx="44" cy="30" r="3" fill="#2A6E88"/><circle cx="56" cy="30" r="3" fill="#79B425"/>
  </g>
</svg>
