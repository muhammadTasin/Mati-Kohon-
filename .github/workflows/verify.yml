name: Verify application

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm run test:evaluation
      - run: npm run evaluate:decisions
      - run: npm run evaluate:temporal
      - run: npm run evaluate:haor
      - run: npm run evaluate:drainage
      - run: npm run evaluate:full
      - run: node test_evidence.mjs
      - name: Upload model comparison
        uses: actions/upload-artifact@v4
        with:
          name: model-comparison
          path: |
            research/evaluation/model_comparison.json
            research/evaluation/temporal_comparison.json
            research/evaluation/haor_evaluation.json
            research/evaluation/drainage_evaluation.json
            research/evaluation/full_system_comparison.json
